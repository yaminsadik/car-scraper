name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  marketplace-cdp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/marketplace-cdp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/marketplace-cdp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check cdp.js
      - run: node --check mp.js
      - run: node --check merge.js
      - run: node --check validate.js
